<div class="page-layout overflow-hidden pb-8">
  <div class="header-bg blue"></div>
  <div class="content">
    <div class="container-fluid p-6 flex justify-center align-center">
      <form [formGroup]="basicForm" (ngSubmit)="onSearch()">
        <!-- Device No Field -->
        <mat-form-field>
          <input
            matInput
            type="text"
            formControlName="deviceNo"
            placeholder="Device No"
            id="deviceNo"
          />
          <div
            *ngIf="
              basicForm.controls['deviceNo'].invalid &&
              basicForm.controls['deviceNo'].touched
            "
            class="error"
          >
            Select the Device No.
          </div>
        </mat-form-field>

        <!-- Start Date Field -->
        <mat-form-field>
          <input
            formControlName="startDate"
            matInput
            [matDatepicker]="picker"
            placeholder="Start Date"
            required
          />
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <!-- End Date Field with min restriction and custom validation message -->
        <mat-form-field>
          <input
            formControlName="endDate"
            matInput
            [matDatepicker]="endpicker"
            placeholder="End Date"
            required
            [min]="minEndDate"
          />
          <mat-datepicker-toggle matSuffix [for]="endpicker"></mat-datepicker-toggle>
          <mat-datepicker #endpicker></mat-datepicker>

          <!-- Show error if endDate is invalid OR earlier than startDate -->
          <div
            *ngIf="
              (basicForm.controls['endDate'].invalid && basicForm.controls['endDate'].touched) ||
              (basicForm.hasError('endBeforeStart') && basicForm.get('endDate')?.touched)
            "
            class="error"
          >
            End Date should be the same or after Start Date.
          </div>
        </mat-form-field>

        <!-- Search Button (disabled if form is invalid) -->
        <button mat-raised-button class="searchBTN" type="submit" [disabled]="basicForm.invalid">
          Search
        </button>
      </form>
    </div>

    <div class="content-body">
      <div class="content-card mat-bg-default" style="padding-right: 10px">
        <mat-tab-group>
          <mat-tab label="Kalpvriksha Hybrid Report">
            <app-datareport></app-datareport>
          </mat-tab>
          <mat-tab label="Kalpvriksha Cumulative Report">
            <app-cumulative></app-cumulative>
          </mat-tab>
        </mat-tab-group>
      </div>
    </div>
  </div>
</div>
