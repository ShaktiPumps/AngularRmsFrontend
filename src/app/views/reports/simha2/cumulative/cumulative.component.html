<!-- cumulative.component.html -->
<div *ngIf="cumulativeData.length > 0; else noData">
  <table mat-table [dataSource]="cumulativeData" class="mat-elevation-z8">
    <ng-container matColumnDef="parameter">
      <th mat-header-cell *matHeaderCellDef> Parameter </th>
      <td mat-cell *matCellDef="let element"> {{ element.parameter }} </td>
    </ng-container>

    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef> Value </th>
      <td mat-cell *matCellDef="let element"> {{ element.value }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['parameter', 'value']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['parameter', 'value'];"></tr>
  </table>
</div>

<ng-template #noData>
  <p>No data available.</p>
</ng-template>
