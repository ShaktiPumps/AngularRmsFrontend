<div class="ml-2 mr-2 rtl:ml-2 mt-8 !pb-4" >
    <div style="width: 1225px; " class="mat-elevation-z8" [@animate]="{value:'*',params:{y:'50px',delay:'300ms'}}">
        <mat-table [dataSource]="dataSource" matSort >
  
            <ng-container  matColumnDef="id">
              <mat-header-cell *matHeaderCellDef mat-sort-header > ID </mat-header-cell>
              <mat-cell *matCellDef="let row" data-label="id"> {{row.id}} </mat-cell>
            </ng-container>
        
            <ng-container matColumnDef="device" >
              <mat-header-cell *matHeaderCellDef mat-sort-header> Device No. </mat-header-cell>
              <mat-cell *matCellDef="let row" data-label="progress"> {{row.device}} </mat-cell>
            </ng-container>
        
            <ng-container matColumnDef="dongle" sticky> 
              <mat-header-cell *matHeaderCellDef mat-sort-header> Dongle No	 </mat-header-cell>
              <mat-cell *matCellDef="let row" data-label="name"> {{row.dongle}} </mat-cell>
            </ng-container>
        
            <ng-container matColumnDef="Date" sticky>
              <mat-header-cell *matHeaderCellDef mat-sort-header> Date </mat-header-cell>
              <mat-cell *matCellDef="let row" [style.color]="row.color" data-label="color"> {{row.Date}} </mat-cell>
            </ng-container>
  
            <ng-container matColumnDef="CustomerName">
              <mat-header-cell *matHeaderCellDef mat-sort-header> Customer Name </mat-header-cell>
              <mat-cell *matCellDef="let row" [style.color]="row.color" data-label="color"> {{row.CustomerName}} </mat-cell>
            </ng-container>
  
            <ng-container matColumnDef="TodayEnergy">
              <mat-header-cell *matHeaderCellDef mat-sort-header> Today Energy (kWh) </mat-header-cell>
              <mat-cell *matCellDef="let row" [style.color]="row.color" data-label="color"> {{row.TodayEnergy}} </mat-cell>
            </ng-container>
            <ng-container matColumnDef="Todayflow">
              <mat-header-cell *matHeaderCellDef mat-sort-header> Today Flow (m3) </mat-header-cell>
              <mat-cell *matCellDef="let row" [style.color]="row.color" data-label="color"> {{row.Todayflow}} </mat-cell>
            </ng-container>
            <ng-container matColumnDef="todayTime">
              <mat-header-cell *matHeaderCellDef mat-sort-header> Today On Time (Hr) </mat-header-cell>
              <mat-cell *matCellDef="let row" [style.color]="row.color" data-label="color"> {{row.todayTime}} </mat-cell>
            </ng-container>
            
        
            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;">
            </mat-row>
        </mat-table>
        <mat-paginator [pageSizeOptions]="[10, 20, 50, 100]"></mat-paginator>
    </div>
  </div>
