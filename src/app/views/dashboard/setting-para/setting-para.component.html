<div *ngIf="isLoading" class="overlay">
  <div class="loader"></div>
</div>

<div *ngIf="apiData?.response?.length; else noData">
  <div class="category-tabs">
    <button
      *ngFor="let category of apiData.response"
      (click)="selectCategory(category)"
      [class.active]="selectedCategory === category"
    >
      {{ category.parametername }}
    </button>
  </div>
  
  <div class="action-buttons">
    <button class="feed-on-btn" (click)="feedOn()">Feed On</button>
    <button class="feed-off-btn" (click)="feedOff()">Feed Off</button>
    <button class="read-all-btn" (click)="readAllParameters()">Read All</button>
  </div>

  <div class="table-container" *ngIf="selectedCategory">
    <h3>{{ selectedCategory.parametername }}</h3>
    <table>
      <thead>
        <tr>
          <th>Functional Code</th>
          <th>Parameter Name</th>
          <th>Unit</th>
          <th>Value</th>
          <th>Operating</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let param of selectedCategory?.parameterList">
          <td>{{ param.PreName }}</td>
          <td>{{ param.PName }}</td>
          <td>{{ param.Punit }}</td>
          <td>
            <input
              [(ngModel)]="param.value"
              type="text"
              placeholder="Enter value"
              [disabled]="!param.editable"
            />
          </td>
          <td>
            <!-- <span *ngIf="param.isLoading" class="loader-large"></span> -->
            <div *ngIf="param.isLoading" class="loader-large"></div>
            <span *ngIf="!param.isLoading">{{ param.result || "" }}</span>
          </td>
          <td>
            <button class="btn read-btn" (click)="readParameter(param)">
              Read
            </button>
            <button class="btn set-btn" (click)="setParameter(param)" [disabled]="!param.editable">
              Set
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<ng-template #noData>
  <p>No data available.</p>
</ng-template>
